<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..900&display=swap" rel="stylesheet">
    <script src="mail.js" defer></script>
    <link href="styles.css" rel="stylesheet">
    <link type="image/x-icon" rel="icon" href="images/favicon.ico">
    <title>Mail - Bloxxer.Dev</title>
</head>
<body>
 
    <div class="Topbar">Mail.Bloxxer.Dev</div>
 
    <main class="Page">
 
        <!-- Compose -->
        <div class="Email" id="Email">
            <div class="Tabs">
                <button id="ComposeTab" class="Pill Active">Compose</button>
                <button id="InboxTab" class="Pill">Inbox</button>
            </div>
            <div class="AreaHeaders">
                <div class="Header">
                    <input id="ToHeader" class="HeaderContent" type="text" placeholder="To">
                </div>
                <div class="Header">
                    <input id="SubjectHeader" class="HeaderContent" type="text" placeholder="Subject">
                </div>
            </div>
            <textarea id="MessageBody" class="MessageBody" placeholder="Start typing..."></textarea>
            <button id="SendButton" class="Launch">Send!</button>
        </div>
 
        <!-- Inbox -->
        <div class="Email" id="InboxPanel" style="display:none">
            <div class="Tabs">
                <button id="ComposeTab2" class="Pill">Compose</button>
                <button id="InboxTab2" class="Pill Active">Inbox</button>
                <button id="RefreshInbox" class="Pill">Refresh</button>
            </div>
            <div class="InboxLayout">
                <div id="InboxList"></div>
                <div id="InboxViewer"></div>
            </div>
        </div>
 
        <!-- Login / Sign up -->
        <div class="Email" id="LoginPopup">
            <h2>Log in to send emails.</h2>
            <div class="Header">
                <input id="EmailHeader" class="HeaderContent" type="email" placeholder="Email">
            </div>
            <div class="Header">
                <input id="PasswordHeader" class="HeaderContent" type="password" placeholder="Password">
            </div>
            <button id="LoginButton" class="Launch">Login</button>
 
            <h2>Or, Sign Up.</h2>
            <div class="Header">
                <input id="SignupEmailHeader" class="HeaderContent" type="email" placeholder="Email">
            </div>
            <div class="Header">
                <input id="SignupPasswordHeader" class="HeaderContent" type="password" placeholder="Password">
            </div>
            <div class="Header">
                <input id="SignupPasswordConfirm" class="HeaderContent" type="password" placeholder="Type it again">
            </div>
            <div class="Header">
                <input id="SignupNewEmailHeader" class="HeaderContent" type="email" placeholder="New @bloxxer.dev email">
            </div>
            <button id="SignupButton" class="Launch">Sign Up!</button>
        </div>
 
    </main>
 
    <footer class="Footer">&copy; 2026 bloxxer.dev</footer>
</body>
</html>
